<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600">
  <title>大调音阶和声功能体系图</title>
  
  <defs>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#64748b" flood-opacity="0.15"/>
    </filter>
    
    <!-- 箭头标记 -->
    <marker id="arrow-down" markerWidth="10" markerHeight="8" refX="5" refY="8" orient="auto">
      <polygon points="0 0, 10 0, 5 8" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- 主标题 -->
  <text x="480" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" 
        font-size="24" font-weight="700" fill="#1e293b">大调音阶和声功能体系 (C大调示例)</text>

  <!-- ================================================================================== -->
  <!-- 1. 主功能组 (Tonic) - 蓝色系 -->
  <!-- ================================================================================== -->
  <g class="layer-tonic" transform="translate(0, 80)">
    <!-- 层标签 -->
    <text x="110" y="65" text-anchor="end" font-family="system-ui, sans-serif" 
          font-size="14" font-weight="700" fill="#1e40af">主功能组</text>
    <text x="110" y="85" text-anchor="end" font-family="system-ui, sans-serif" 
          font-size="11" fill="#3b82f6">Tonic (T)</text>
    <text x="110" y="100" text-anchor="end" font-family="system-ui, sans-serif" 
          font-size="10" fill="#94a3b8">稳定 / 归属</text>

    <!-- 层容器 -->
    <rect x="130" y="10" width="620" height="130" fill="#f8fafc" 
          stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,4" rx="8"/>

    <!-- I级 (核心) -->
    <g transform="translate(150, 25)">
      <rect width="180" height="100" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
      <text x="90" y="30" text-anchor="middle" font-family="'SF Mono', monospace" font-size="20" font-weight="700" fill="#1e40af">I</text>
      <text x="90" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1e3a8a">C Major</text>
      <text x="90" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3b82f6">大三和弦</text>
      <rect x="60" y="82" width="60" height="14" rx="7" fill="#1e40af"/>
      <text x="90" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff" font-weight="600">核心 Core</text>
    </g>

    <!-- vi级 (从属) -->
    <g transform="translate(350, 25)">
      <rect width="180" height="100" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" filter="url(#shadow)"/>
      <text x="90" y="30" text-anchor="middle" font-family="'SF Mono', monospace" font-size="18" font-weight="600" fill="#1e40af">vi</text>
      <text x="90" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#1e3a8a">A Minor</text>
      <text x="90" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#60a5fa">小三和弦</text>
      <text x="90" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">从属 Sub</text>
    </g>

    <!-- iii级 (从属) -->
    <g transform="translate(550, 25)">
      <rect width="180" height="100" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" filter="url(#shadow)"/>
      <text x="90" y="30" text-anchor="middle" font-family="'SF Mono', monospace" font-size="18" font-weight="600" fill="#1e40af">iii</text>
      <text x="90" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#1e3a8a">E Minor</text>
      <text x="90" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#60a5fa">小三和弦</text>
      <text x="90" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">从属 Sub</text>
    </g>
  </g>

  <!-- ================================================================================== -->
  <!-- 2. 下属功能组 (Subdominant) - 绿色系 -->
  <!-- ================================================================================== -->
  <g class="layer-subdominant" transform="translate(0, 240)">
    <!-- 层标签 -->
    <text x="110" y="65" text-anchor="end" font-family="system-ui, sans-serif" 
          font-size="14" font-weight="700" fill="#047857">下属功能组</text>
    <text x="110" y="85" text-anchor="end" font-family="system-ui, sans-serif" 
          font-size="11" fill="#10b981">Subdominant (S)</text>
    <text x="110" y="100" text-anchor="end" font-family="system-ui, sans-serif" 
          font-size="10" fill="#94a3b8">过渡 / 离心</text>

    <!-- 层容器 -->
    <rect x="130" y="10" width="620" height="130" fill="#f8fafc" 
          stroke="#10b981" stroke-width="1" stroke-dasharray="4,4" rx="8"/>

    <!-- IV级 (核心) -->
    <g transform="translate(150, 25)">
      <rect width="180" height="100" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
      <text x="90" y="30" text-anchor="middle" font-family="'SF Mono', monospace" font-size="20" font-weight="700" fill="#065f46">IV</text>
      <text x="90" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#064e3b">F Major</text>
      <text x="90" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#10b981">大三和弦</text>
      <rect x="60" y="82" width="60" height="14" rx="7" fill="#059669"/>
      <text x="90" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff" font-weight="600">核心 Core</text>
    </g>

    <!-- ii级 (从属) -->
    <g transform="translate(350, 25)">
      <rect width="180" height="100" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1" filter="url(#shadow)"/>
      <text x="90" y="30" text-anchor="middle" font-family="'SF Mono', monospace" font-size="18" font-weight="600" fill="#065f46">ii</text>
      <text x="90" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#064e3b">D Minor</text>
      <text x="90" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">小三和弦</text>
      <text x="90" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">从属 Sub</text>
    </g>
  </g>

  <!-- ================================================================================== -->
  <!-- 3. 属功能组 (Dominant) - 橙色系 -->
  <!-- ================================================================================== -->
  <g class="layer-dominant" transform="translate(0, 400)">
    <!-- 层标签 -->
    <text x="110" y="65" text-anchor="end" font-family="system-ui, sans-serif" 
          font-size="14" font-weight="700" fill="#b45309">属功能组</text>
    <text x="110" y="85" text-anchor="end" font-family="system-ui, sans-serif" 
          font-size="11" fill="#f59e0b">Dominant (D)</text>
    <text x="110" y="100" text-anchor="end" font-family="system-ui, sans-serif" 
          font-size="10" fill="#94a3b8">紧张 / 倾向</text>

    <!-- 层容器 -->
    <rect x="130" y="10" width="620" height="130" fill="#f8fafc" 
          stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,4" rx="8"/>

    <!-- V级 (核心) -->
    <g transform="translate(150, 25)">
      <rect width="180" height="100" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
      <text x="90" y="30" text-anchor="middle" font-family="'SF Mono', monospace" font-size="20" font-weight="700" fill="#92400e">V</text>
      <text x="90" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#78350f">G Major / G7</text>
      <text x="90" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f59e0b">大三/属七</text>
      <rect x="60" y="82" width="60" height="14" rx="7" fill="#d97706"/>
      <text x="90" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff" font-weight="600">核心 Core</text>
    </g>

    <!-- vii°级 (从属) -->
    <g transform="translate(350, 25)">
      <rect width="180" height="100" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" filter="url(#shadow)"/>
      <text x="90" y="30" text-anchor="middle" font-family="'SF Mono', monospace" font-size="18" font-weight="600" fill="#92400e">vii°</text>
      <text x="90" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#78350f">B Dim</text>
      <text x="90" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24">减三和弦</text>
      <text x="90" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">从属 Sub</text>
    </g>
  </g>

  <!-- ================================================================================== -->
  <!-- 4. 稳定性排序 (Right Side) -->
  <!-- ================================================================================== -->
  <g class="stability-ranking" transform="translate(780, 80)">
    <rect x="0" y="10" width="140" height="450" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    
    <text x="70" y="40" text-anchor="middle" font-family="system-ui, sans-serif" 
          font-size="14" font-weight="700" fill="#334155">稳定性排序</text>
    <text x="70" y="55" text-anchor="middle" font-family="system-ui, sans-serif" 
          font-size="10" fill="#64748b">Stability Ranking</text>
    
    <!-- 箭头轴 -->
    <line x1="70" y1="70" x2="70" y2="430" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow-down)"/>
    
    <!-- 排序项 -->
    <g transform="translate(70, 90)">
      <circle r="18" fill="#3b82f6"/>
      <text y="5" text-anchor="middle" fill="white" font-weight="bold" font-family="'SF Mono', monospace">I</text>
      <text x="30" y="5" font-size="10" fill="#3b82f6" font-weight="bold">最稳</text>
    </g>
    
    <g transform="translate(70, 140)">
      <circle r="16" fill="#93c5fd"/>
      <text y="5" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="'SF Mono', monospace">vi</text>
    </g>
    
    <g transform="translate(70, 190)">
      <circle r="16" fill="#bfdbfe"/>
      <text y="5" text-anchor="middle" fill="#1e40af" font-weight="bold" font-family="'SF Mono', monospace">iii</text>
    </g>
    
    <g transform="translate(70, 240)">
      <circle r="16" fill="#6ee7b7"/>
      <text y="5" text-anchor="middle" fill="#064e3b" font-weight="bold" font-family="'SF Mono', monospace">IV</text>
    </g>
    
    <g transform="translate(70, 290)">
      <circle r="16" fill="#a7f3d0"/>
      <text y="5" text-anchor="middle" fill="#064e3b" font-weight="bold" font-family="'SF Mono', monospace">ii</text>
    </g>
    
    <g transform="translate(70, 340)">
      <circle r="16" fill="#fcd34d"/>
      <text y="5" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="'SF Mono', monospace">V</text>
    </g>
    
    <g transform="translate(70, 390)">
      <circle r="16" fill="#fde68a"/>
      <text y="5" text-anchor="middle" fill="#92400e" font-weight="bold" font-family="'SF Mono', monospace">vii°</text>
      <text x="30" y="5" font-size="10" fill="#b45309" font-weight="bold">最躁</text>
    </g>
  </g>

</svg>