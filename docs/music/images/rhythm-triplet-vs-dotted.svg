<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img" aria-labelledby="title desc">
  <title id="title">三连音与前后附点：同一拍的三种分配</title>
  <desc id="desc">每行总长一拍。三连音三块等长；前附点是四分之三拍加四分之一拍，后附点相反。块间留缝仅用于分隔。</desc>
  <style>
    svg { --ink: #1e293b; --muted: #475569; --green: #10b981; --amber: #f59e0b; }
    text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: var(--ink); }
    .label { text-anchor: end; }
    .hint { fill: var(--muted); }
    .binary rect { fill: var(--green); }
    .triplet rect { fill: var(--amber); }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #e2e8f0; --muted: #cbd5e1; --green: #34d399; --amber: #fbbf24; }
    }
  </style>
  <text class="hint" x="16" y="25">四分音符 = 1 拍；各行总时值相同</text>
  <g class="triplet">
    <text class="label" x="98" y="65">三连音</text>
    <rect x="112" y="48" width="68" height="26" rx="3"/><rect x="184" y="48" width="68" height="26" rx="3"/><rect x="256" y="48" width="68" height="26" rx="3"/>
    <text x="112" y="99">1/3 + 1/3 + 1/3（1 : 1 : 1）</text>
  </g>
  <g class="binary" id="dotted-front">
    <text class="label" x="98" y="151">前附点</text>
    <rect x="112" y="134" width="158" height="26" rx="3"/><rect x="274" y="134" width="50" height="26" rx="3"/>
    <text x="112" y="185">3/4 + 1/4（3 : 1）</text>
  </g>
  <g class="binary" id="dotted-back">
    <text class="label" x="98" y="237">后附点</text>
    <rect x="112" y="220" width="50" height="26" rx="3"/><rect x="166" y="220" width="158" height="26" rx="3"/>
    <text x="112" y="271">1/4 + 3/4（1 : 3）</text>
  </g>
</svg>
